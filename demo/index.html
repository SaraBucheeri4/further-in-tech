<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pearl Mobile · Sample bill</title><link rel="stylesheet" href="demo.css"><script src="demo.js" defer></script></head><body>
<header><span>Pearl Mobile</span><small>Fictional checkout</small></header>
<main><div class="intro"><p class="eyebrow">Monthly statement</p><h1>Your bill</h1><p class="lede">Review the sample balance and payment request.</p></div>
<section class="invoice" aria-label="Statement"><div class="invoice-top"><span>Amount due</span><strong><small>BD</small> 1.500</strong></div><div class="line"><span>Mobile service</span><b>BD 1.500</b></div><div class="line"><span>Reference</span><b>DEMO–014</b></div><section class="fields"><label for="card">Card number</label><input id="card" autocomplete="cc-number" placeholder="••••   ••••   ••••   ••••" readonly><button id="next">Show code step</button></section></section>
<p class="foot">Demo only. Fields are read-only. No payment is taken.</p></main>
</body></html>
